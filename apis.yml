aid: sendhq
name: SendHQ
description: >-
  SendHQ is a transactional email API for product teams and AI agents — verified-domain sending,
  inbound email, hosted templates, drafts and attachments, delivery events, suppressions and
  workspace-scoped API keys, with a web dashboard at app.sendhq.cc. The public contract is an
  OpenAPI 3.1 document of 32 paths and 47 operations served from sendhq.cc/api/v1, authenticated
  with a bearer token or a session cookie. The largest operation groups are hosted templates,
  drafts and attachments, emails and threads, account and billing, domains, inbound email and
  deliverability. The company markets the product explicitly at coding agents.
