  note: >-
    Submitted via apis.io/add on 2026-08-24 and auto-published by the gate at rating 51.
    THE HOST RETURNS A SOFT-200 AND IT NEARLY COST THEM THE LISTING. sendhq.cc answers any
    unknown path with an identical 1,212-byte HTML page — same SHA for /apis.json, for
    /for-agents, and for two invented control paths. Both URLs in the submission point at that
    page, so the first pass read the whole site as a catch-all and the record was almost declined
    on that basis. It was wrong. The real pages are real and each a different size: /docs 8,806,
    /docs/api-reference 8,306, /guides 13,363, plus tools, templates, glossary, terms, privacy and
    contact. The 1,212-byte page is only what a missing path returns.
    The specification is at /openapi.json — 48,625 bytes, OpenAPI 3.1, 32 paths, 47 operations,
    bearerAuth and sessionCookie — and was found from the site's own API-reference page rather
    than by guessing. The API is live and correctly gated: /api/v1/emails and /api/v1/domains both
    return 401 JSON.
    ONE THING FOR THE PROVIDER. SendHQ markets itself as an "AI-agent-ready email API" aimed at
    Claude, Codex, Cursor and OpenClaw, and its llms.txt is real. But /.well-known/agent.json,
    /.well-known/api-catalog and /.well-known/mcp all return the 1,212-byte catch-all rather than
    a document, so an agent discovering this provider the standard way finds nothing. Only the
    llms.txt and the OpenAPI are genuinely served.
    Every URL recorded here was fetched and its size checked against that catch-all so no artifact
    in this record is the placeholder page.
